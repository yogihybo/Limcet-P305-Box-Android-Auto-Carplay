# custom_ui HAL configuration -- Bluetooth (blueware daemon) and WiFi
# AP (wireless Android Auto/CarPlay handoff) settings. Edit this file
# directly to change any of these without rebuilding custom_ui or
# androidauto-sidecar; both read it at startup.
#
# This is the tracked source copy. `make ui`/`make androidauto-sidecar`
# stage it into build/hal.conf automatically, right alongside the
# compiled binaries -- scp the whole build/ directory to the device
# (the actual fast-iteration workflow, see scripts/run_on_device.sh's
# own header comment on why this project tests that way instead of
# reflashing) and it's picked up with no /etc or /data setup needed.
#
# Full search order (first match wins, no merging across paths -- see
# custom_ui/src/core/hal_config.h):
#   1. <directory containing the running binary>/hal.conf -- the
#      build/hal.conf staging above lands here.
#   2. /data/custom_ui/hal.conf -- writable userdata partition, the
#      real edit target on a device that's been properly deployed
#      (reflash-proof, unlike /etc).
#   3. /etc/custom_ui/hal.conf -- would be a real firmware image's
#      shipped default; custom_ui isn't wired into a firmware_overlay
#      image build yet (it's currently deployed via scp/run_on_device.sh,
#      not a reflash), so nothing places a file there today -- kept as
#      a search path for when that changes, not because anything
#      deploys it yet.
# Falls back to the built-in defaults below if no file is found
# anywhere (e.g. a dev host build) -- non-fatal, matching every other
# optional-file HAL in this codebase.

[Bluetooth]
# Path to the Feasycom blueware daemon binary.
DaemonPath=/usr/bin/blueware
# Properties file blueware is launched with -- selects module type
# (BW121 vs BW123) and UART/GPIO wiring. This board is the BW121
# variant (docs/WIRELESS_AND_INIT.md section 5) -- confirmed via
# decompile of the real stock app's own launch command.
PropertiesPath=/etc/blueware-bw121.properties
# AT-command channel blueware exposes once running.
SerialPort=/dev/bw_serial
# Where blueware's own stdout/stderr get redirected. Matches the stock
# app (/dev/null) -- a log file here was tried as an improvement (to
# surface blueware's own GPIO91/bpio_init error messages, see
# docs/WIRELESS_AND_INIT.md section 5) but reverted per explicit
# request: not needed in practice, and it's one more file quietly
# growing on /tmp. Change this if diagnosing a Bluetooth-enable
# failure needs it again for a specific debugging session.
LogPath=/dev/null

[WiFi]
# Script that brings up this device's own dynamic hostapd AP for
# wireless Android Auto/CarPlay credential handoff.
ApScript=/etc/wifi_ap.sh
# This device's own AP address once wifi_ap.sh has run.
ApAddress=192.168.43.1
# SSID/password the AP advertises and hands to the phone over
# Bluetooth during the wireless pairing handshake.
ApSsid=carplay_wifi
ApPassword=88888888
# Security mode value sent in the WIFI_INFO_RESPONSE step of the
# bw_aap handshake (see androidauto/bw_aap_client.h) -- 8 = WPA2-PSK,
# cross-checked against this device's real hostapd config.
ApSecurityMode=8
# TCP port THIS DEVICE LISTENS ON (0.0.0.0), for the phone to dial into
# once it's joined the AP -- see wireless_session_manager.h. 5277 is
# Google's real WPP default, confirmed via a working open-source
# reference (github.com/mossyhub/openautolink). Briefly changed to 5288
# earlier the same day on a wrong guess that the bug was port, not
# direction (this device connecting OUT instead of listening) -- reverted.
SessionPort=5277
