# READ-ONLY OpenOCD config for the STM32F105 companion MCU INSTALLED IN THE CAR.
#
# Same probe as tools/pico_stm32.cfg (Raspberry Pi Pico debugprobe, CMSIS-DAP,
# SWD), but the target is declared WITHOUT a flash bank. The car's MCU is at
# read-protection level 1: removing it (stm32f1x unlock / option-byte writes)
# mass-erases the genuine factory bootloader and app. With no flash bank,
# OpenOCD has no flash, stm32f1x unlock/lock/options_* or mass_erase commands
# for this target, so no command or script can start that by mistake.
#
# Use for register reads only, e.g.
#   openocd -f tools/pico_stm32_vehicle_readonly.cfg -c init \
#           -c "mdw 0x4002201C" -c "mdw 0x40022020" -c shutdown
# (FLASH_OBR: RDPRT bit 1 = read protection active; FLASH_WRPR: write protection)
#
# Avoid "halt"/"reset" on the car: halting the MCU can hold the head unit's SoC
# in reset and lets the IWDG reset the MCU. Plain memory reads don't halt it.
# Software updates go over UART through the genuine factory bootloader
# (tools/mcu_update_sender.py), which never touches read protection.

source [find interface/cmsis-dap.cfg]
transport select swd
adapter speed 1000

set _CHIPNAME stm32f1x
swd newdap $_CHIPNAME cpu -expected-id 0x1ba01477
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
target create $_CHIPNAME.cpu cortex_m -dap $_CHIPNAME.dap

# Never drive a reset line, and no reset-init writes.
reset_config none

gdb_port disabled
tcl_port disabled
telnet_port disabled
