#beacon_int=20
#max_listen_interval=100
#ap_table_expiration_time=30
#hs20=1
ctrl_interface=/var/run/hostapd
ssid=carplay_wifi
# 2026-08-16: switched from hw_mode=g channel=11 (2.4GHz) to hw_mode=a
# channel=36 (5GHz) -- this file's own SSID/password already matched
# what MsnCoreApp uses for real AA/CarPlay ("carplay_wifi"/"88888888"),
# but real hardware confirmed stock's own connection runs on 5GHz,
# not 2.4GHz. Checked this project's own earlier tracing
# (firmware_overlay/README.md, hostapd.sh's rtw_country_code=US entry,
# 2026-08-04): MsnCoreApp generates its own dynamic per-connection
# hostapd config at /tmp/hostapd.conf with exactly hw_mode=a
# channel=36, and the whole rtw_country_code=US fix already applied in
# rcS/hostapd.sh exists specifically to make that channel work at all
# (without it, the rtl8811cu driver's regulatory fallback excludes
# 5GHz UNII-1 channels entirely) -- so the prerequisite this change
# needs is already hardware-confirmed in place. This project's own
# wifi_ap.sh (the static AP this file backs) was never switched over
# to match, and stayed on the untouched-by-that-fix 2.4GHz path this
# whole time. 2.4GHz is also far more congested for a live video
# stream in a vehicle environment -- a real, plausible contributor to
# the tearing/stutter this project chased all session on the display
# side alone.
hw_mode=a
channel=36
interface=wlan0
#bridge=br0
driver=nl80211
ignore_broadcast_ssid=0
#macaddr_acl=0
#accept_mac_file=/etc/hostapd.accept
#deny_mac_file=/etc/hostapd.deny
#interworking=1
access_network_type=0
internet=0
asra=0
esr=0
uesa=0
venue_group=10
venue_type=1
vendor_elements=dd3000a0400000020022020961726B6D6963726F0003064C696E75780004030102030606ffffffffffff070656fadde250c0
auth_algs=1
wpa=2
wpa_passphrase=88888888
wpa_key_mgmt=WPA-PSK
wpa_pairwise=TKIP
rsn_pairwise=CCMP
#hessid=02:03:04:05:06:07
