<!-- Real /usr/etc/dbus-1/system.conf from this rootfs, with ONE change:
     <user>messagebus</user> -> <user>root</user>. This device has no
     "messagebus" system user at all (/etc/passwd has only root), so
     the real config's own getpwnam("messagebus") privilege-drop fails
     outright ("Could not get UID and GID for username \"messagebus\"")
     -- confirmed real hardware failure, 2026-08-19. Everything else on
     this device already runs as root (see this project's own
     conventions throughout), so this just makes that explicit rather
     than trying to add a system user this rootfs was never set up to
     have. Everything else (listen address, policy, includedir for
     system.d -- staged separately by bt-daemon-probe.sh -- is
     byte-identical to the real file, so this only changes the one
     thing that was actually broken. -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>

  <type>system</type>

  <user>root</user>

  <fork/>

  <pidfile>/var/run/run/dbus/pid</pidfile>

  <auth>EXTERNAL</auth>

  <listen>unix:path=/var/run/run/dbus/system_bus_socket</listen>

  <policy context="default">
    <deny send_interface="*"/>
    <deny receive_interface="*"/>
    <deny own="*"/>
    <allow user="*"/>
    <allow send_destination="org.freedesktop.DBus"/>
    <allow receive_sender="org.freedesktop.DBus"/>
    <allow send_requested_reply="true"/>
    <allow receive_requested_reply="true"/>
  </policy>

  <includedir>system.d</includedir>

  <include ignore_missing="yes">system-local.conf</include>

  <include if_selinux_enabled="yes" selinux_root_relative="yes">contexts/dbus_contexts</include>

</busconfig>
