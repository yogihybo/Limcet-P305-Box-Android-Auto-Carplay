# OpenOCD Configuration for Raspberry Pi Pico (Debugprobe CMSIS-DAP) -> STM32F105
source [find interface/cmsis-dap.cfg]
transport select swd

# SWD clock speed: 1000 kHz (1 MHz) for signal stability
adapter speed 1000

# Target definition for STM32F1 series
source [find target/stm32f1x.cfg]

# Non-invasive 4-wire connection: no hardware NRST line
reset_config none

# Use software system reset (SYSRESETREQ) to reset core, peripherals, and latch BOOT0
cortex_m reset_config sysresetreq
