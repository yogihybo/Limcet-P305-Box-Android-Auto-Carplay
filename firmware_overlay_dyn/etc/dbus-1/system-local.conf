<!-- Real dbus-daemon local-override file, this rootfs's own intended
     mechanism for changing the default system.conf without editing it
     (see /usr/share/dbus-1/system.conf's own last <include>, "included
     last so local configuration can override what's in this standard
     file"). Real bug this fixes, hardware-confirmed 2026-08-22:
     dbus-daemon's real default (/usr/share/dbus-1/system.conf) has
     <user>dbus</user>, but this device's /etc/passwd has no "dbus"
     user at all -- getpwnam("dbus") fails outright ("Could not get
     UID and GID for username \"dbus\""). Everything on this device
     already runs as root (see this project's own conventions
     throughout), so this just makes that explicit instead of adding a
     system user this rootfs was never set up to have.

     Earlier version of this fix staged a full modified copy of
     system.conf at /usr/etc/dbus-1/system.conf -- a path this
     dbus-daemon (Buildroot's own build, not the old static
     bluetoothd-test one that path was written for) never reads at
     all, so it was silently ignored; this file is the real fix. -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <user>root</user>
</busconfig>
