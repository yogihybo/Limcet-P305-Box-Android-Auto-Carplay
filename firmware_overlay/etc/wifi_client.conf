# Local WiFi network credentials for etc/wifi_client.sh (client/STA mode).
# EDIT THESE before your first boot with client mode enabled -- the
# placeholder values below will never connect to anything.
#
# This intentionally does NOT reuse etc/wpa_supplicant.conf, which is a
# vendor-SDK template (SSID "rtl8821cs", placeholder PSK) of unclear
# origin/use on this unit -- same "shared template, not confirmed used
# here" pattern already found for other leftover config in this project
# (TOUCHSERIAL/COMMANDSERIAL, rtkbt.conf, etc.). Keeping this separate
# avoids any ambiguity about which file is actually authoritative.

WIFI_CLIENT_SSID="YOUR_NETWORK_NAME_HERE"
WIFI_CLIENT_PSK="YOUR_NETWORK_PASSWORD_HERE"
