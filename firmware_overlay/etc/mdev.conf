# 2026-08-04: added for USB mass-storage automount, see etc/usb_domount.sh
# for the full rationale. This file didn't exist anywhere in this project's
# rootfs before -- mdev was only ever run once at boot (`mdev -s`, coldplug
# scan) with no rules at all, so USB storage got a /dev/sdaN node but was
# never mounted anywhere. MsnCoreApp's built-in media player (EnableMediaMode,
# libMusicPlayer.so/libVideoPlayer.so) expects USB storage at a fixed
# multi-slot convention -- confirmed via strings in usr/lib/libMsnCommons.so:
# /media/udisk, /media/udisk2, /media/udisk3 (first/second/third inserted
# device).
#
# `*` runs the given command on BOTH add and remove (mdev sets $ACTION);
# usb_domount.sh itself branches on $ACTION to mount or unmount.
# sd[a-z][1-9]: whole-disk nodes (sda, sdb, no trailing digit) are
# deliberately NOT matched here -- only partitions (sda1, sdb2, ...), since
# mounting the raw whole-disk device instead of a partition would be wrong
# for any normally-partitioned USB stick.
sd[a-z][1-9]	root:disk 0660 */etc/usb_domount.sh
