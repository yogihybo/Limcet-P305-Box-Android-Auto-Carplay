;
;----------------------------------------------<DISPLAY_INTERFACE>
; ScreenType  | RGB565:1   RGB888:2   LVDS  :4  VGA   :8         |
;             | CVBS  :16  YPBPR :32  ITU656:64 ITU601:128       |
;-----------------------------------------------------------------
; Format      |   RGB_888: 7     RGB_565: 5                      |
; RgbMode     |   BGR: 0         RGB: 5                          |
; interlace   |   1:CVBS,ITU656,YPBPR-i   0:other                |
;-----------------------------------------------------------------
; TvoutType   |                                                  |
; wince:   NONE:0  COMPOSITE:1  YPBPR:2  VGA:3 ITU656:4          |
; linux:                                                         |
;   I480HZ60:0  P720HZ50: 5  CVBS_PAL:   11  VGA_640x480HZ60:  15|
;   I576HZ50:1  I1080HZ60:6  CVBS_NTSC:  12  VGA_800x600HZ60:  16|
;   P480HZ60:2  I1080HZ50:7  ITU656_PAL: 13  VGA_1024x768HZ60: 17|
;   P576HZ50:3  P1080HZ60:9  ITU656_NTSC:14  VGA_1280x1024HZ60:18|
;   P720HZ60:4  P1080HZ50:10                 VGA_1900x1200HZ60:19|
;   I1080HZ50_1250:8                         VGA_1280x1024HZ75:20|
; -----------------------------------        VGA_1280x960HZ85: 21|
; FrameRate   |                              VGA_1280x720HZ60: 22|
;----------------------------------------------------<LCD_TIMMING>
; Width       |                                                  |
; Height      |                                                  |
; HSW         |                                                  |
; HBP         |                                                  |
; HFP         |                                                  |
; VSW         |                                                  |
; VBP         |                                                  |
; VFP         |                                                  |
; IHS         |   HSYNCPolarity:  0 or 1                         |
; IVS         |   VSYNCPolarity:  0 or 1                         |
; IOE         |   DEPolarity   :  0 or 1                         |
;------------------------------------------------------<LCD_CLOCK>
; ClkSource   |  CPUPLL:0 SYSPLL: 1 DDS: 2  24MCLK : 4           |
; ClkPolarity |   0 or 1                                         |
; ClkFreq     |   set 200-300MHZ for DDS                         |
; ClkDIV1     |   int_srgb_clk_div : 0-15                        |
; ClkDIV2     |   IntLcdClk_div    : 0-7                         |
;---------------------------------------------------<LVDS_SPECIAL>
; LVDSCfg     |   valid ScreenType=4(LVDS)  0xE0EC/0x160FD...    |
;-------------------------------------------------------------<VP>
; Contrast    |        0-255    default: 128                     |
; Brightness  |        0-255    default: 128                     |
; Saturation  |        0-255    default: 64                      |
; Hue         |        0-255    default: 0                       |
;-----------------------------------------------------<ITU656_BYP>
; ModeControl |        default: 0x00001D80                       |
; VGATE_DELAY |        default: 10                               |
; DEN_V_STOP  |        default: 10                               |
; DEN_V_START |        default: 0                                |
; TVGDEL      |        default: 2                                |
; TVSYNC      |        default: 2                                |
; THGDEL      |        default: 20                               |
; THSYNC      |        default: 2                                |
; THLEN       |        default: PAL:1160  NTSC:954               |
; THGATE      |        default: 800                              |
; TVLEN       |        default: PAL:520  NTSC:525                |
; TVGATE      |        default: 480                              |
; VFZ         |        default: PAL:618  NTSC:516                |
; HFZ         |        default: PAL:908  NTSC:916                |
; DATENA_INV  |                0 or 1                            |
; VSYNC_INV   |                0 or 1                            |
; HSYNC_INV   |                0 or 1                            |
; FIELD_INV   |                0 or 1                            |
; HV_DELAY    |                0 or 1                            |
;------------------------------------------------------<GAMMA_VAL>
; Gamma_en    |  disable: 0     enable:3                         |
; Gamma0      |                                                  |
; ...         |                                                  |
;-----------------------------------------------------------------

