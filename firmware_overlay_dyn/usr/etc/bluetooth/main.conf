# 2026-08-23: real hw bug -- with custom_ui now auto-starting at boot
# (rcS), bluetoothd becomes discoverable with whatever default name
# BlueZ falls back to ("BlueZ 5.66") well before custom_ui's own
# hal::set_device_name() gets a chance to run (it's called late in
# custom_ui's own startup, after LVGL/display init) -- a phone's active
# scan routinely catches and caches that default name before the real
# one is ever set, and never re-scans to pick up the change. Setting
# it here instead means bluetoothd advertises the real name from the
# moment it starts, closing the race entirely for the default case.
# custom_ui's own runtime hal::set_device_name() (hal/bluetooth.cpp)
# still runs afterward and harmlessly re-applies the same name, or
# updates it if the user changes the DeviceName setting later.
#
# Must match core::default_store()'s own "DeviceName" default
# ("Prado CustomUI", see main.cpp) -- if that default ever changes,
# update this too.
[General]
Name = Prado CustomUI
