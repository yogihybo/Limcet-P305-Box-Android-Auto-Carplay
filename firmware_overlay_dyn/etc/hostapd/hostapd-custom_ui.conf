#beacon_int=20
#max_listen_interval=100
#ap_table_expiration_time=30
#hs20=1
ctrl_interface=/var/run/hostapd
# 2026-08-16: dedicated config for custom_ui's own AP (see
# wireless_session_manager.cpp/wifi_ap.sh), deliberately NOT
# /etc/hostapd/hostapd.conf -- that path is what MsnCoreApp's own
# hostapd.sh references, and this project's own earlier tracing
# (firmware_overlay/README.md, 2026-08-04) confirmed MsnCoreApp
# actually generates its own dynamic per-connection config at
# /tmp/hostapd.conf at runtime rather than reading the static file
# anyway -- but per explicit request, custom_ui's own AP now uses a
# fully separate config file (this one) and a distinct SSID, so the
# two are never sharing state, and MsnCoreApp's own real AA/CarPlay AP
# keeps working entirely on its own, unaffected by anything here.
#
# Distinct SSID (custom_ui_wifi, not MsnCoreApp's real "carplay_wifi")
# so a phone can never confuse the two networks with each other --
# same underlying concern as sharing a config file, just from the
# phone's side (cached-credential/auto-reconnect mixups between two
# different real APs that happen to advertise identical SSID/password).
ssid=custom_ui_wifi
# hw_mode=a channel=36 (5GHz), not the old hw_mode=g channel=11
# (2.4GHz) this file replaces -- user directly confirmed real stock
# uses 5GHz for its own AA/CarPlay connection; matches MsnCoreApp's own
# confirmed real values (see this project's rtw_country_code=US fix,
# already applied in rcS/hostapd.sh and wifi_ap.sh, which exists
# specifically to make channel 36 regulatorily valid on this
# rtl8811cu driver). 2.4GHz is also significantly more congested for a
# live video stream in a vehicle environment.
hw_mode=a
channel=36
interface=wlan0
#bridge=br0
driver=nl80211
ignore_broadcast_ssid=0
#macaddr_acl=0
#accept_mac_file=/etc/hostapd.accept
#deny_mac_file=/etc/hostapd.deny
#interworking=1
access_network_type=0
internet=0
asra=0
esr=0
uesa=0
venue_group=10
venue_type=1
vendor_elements=dd3000a0400000020022020961726B6D6963726F0003064C696E75780004030102030606ffffffffffff070656fadde250c0
auth_algs=1
wpa=2
wpa_passphrase=88888888
wpa_key_mgmt=WPA-PSK
wpa_pairwise=TKIP
rsn_pairwise=CCMP
#hessid=02:03:04:05:06:07
