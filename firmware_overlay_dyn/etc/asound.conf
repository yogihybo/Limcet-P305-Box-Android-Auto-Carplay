# 2026-08-29: pcm.carpi_eq_out inserted between dmix and the real hardware
# device -- a real, system-wide 3-band EQ + dynamic loudness stage
# (custom_ui/ladspa_eq/carpi_eq.c), hosted via ALSA's own built-in
# "type ladspa" PCM plugin (confirmed compiled directly into this
# target's libasound.so -- see BUILD_PCM_PLUGIN_LADSPA_TRUE in
# alsa-lib's own build config, no extra package/staging needed for the
# hosting mechanism itself, just the plugin .so below).
#
# Why here specifically: every softvolN control (softmaster/1/2/3/4,
# see the dmix comment below) already converges on this ONE shared dmix
# instance before reaching hardware -- inserting the EQ as dmix's own
# downstream slave means exactly ONE plugin instance processes the
# fully-mixed output of every audio source on the device at once (AA
# media/guidance/system, stock ArkMediaPlayer, radio, Bluetooth, etc),
# not one instance per source, which matters on this device's single-
# core Cortex-A5. Fixes a real, confirmed bug: the original EQ/Loudness
# implementation lived entirely inside micro_aap's own per-sample AA
# audio sink, so it silently did nothing for any non-AA audio source and
# nothing at all unless an AA session happened to be connected at the
# moment the toggle was flipped -- see custom_ui/src/hal/audio.cpp and
# custom_ui/ladspa_eq/carpi_eq.c's own header comment for the full
# reasoning and the real, load-bearing limitation this design works
# around (ALSA's own "type ladspa" PCM plugin has no live/dynamic
# control-value mechanism -- confirmed by reading pcm_ladspa.c directly
# -- so this plugin polls a small parameter file each run() call
# instead of using LADSPA control ports at all).
pcm.carpi_eq_out {
        type ladspa
        slave {
                pcm "hw:0,0"
                # Same real hw-tuning parameters this project already
                # applies to hw:0,0 directly (see the dmix comment
                # below for the full reasoning on each) -- moved one
                # level deeper now that dmix's own slave is this LADSPA
                # node rather than hw:0,0 itself.
                period_size 2048
                buffer_size 16384
                rate 48000
        }
        path "/usr/lib/ladspa"
        plugins {
                0 {
                        label "carpi_eq"
                        filename "/usr/lib/ladspa/carpi_eq.so"
                        policy none
                        input {
                                bindings { 0 0; 1 1 }
                        }
                        output {
                                bindings { 0 2; 1 3 }
                        }
                }
        }
}
pcm.!dmix {
        type dmix
        ipc_key 6789
        ipc_key_add_uid yes
        slave {
                pcm "carpi_eq_out"
                # 2026-08-03: doubled from 1024 -- this is the real dmix
                # slave for AA media audio (softvol/softvol1/softvol2/
                # softvol4 all route here, see ArkMediaPlayer::setup()'s
                # mode->softvolN mapping, docs/AUDIO_SUBSYSTEM_
                # INVESTIGATION.md). buffer_size unchanged, so this halves
                # the period count (16 -> 8) rather than adding overall
                # latency -- each individual period write gets a wider
                # deadline (~42.6ms instead of ~21.3ms @ 44100Hz) to
                # absorb single-core CPU/scheduling jitter before an XRUN,
                # at the cost of coarser period-complete granularity.
                # Experimental mitigation for the long-running AA audio-
                # stutter investigation, not a confirmed fix -- test
                # independently of the same-day ark_i2s_trigger() mdelay
                # fix so it's clear which change (if either) actually
                # helps.
                #
                # 2026-08-29: period_size/buffer_size/rate below now
                # configure this dmix's own connection to carpi_eq_out
                # (which itself carries the equivalent tuning down to
                # the real hw:0,0 -- see above), not hw:0,0 directly
                # anymore -- kept identical values, no behavior change
                # intended from this specific settings' point of view.
                period_size 2048
                buffer_size 16384
                # 2026-08-21: pinned to 48000 (was left unset/auto-
                # negotiated in the base firmware_source/ copy this
                # overlay file replaces) -- this is the real fix for a
                # two-sided problem docs/AUDIO_CPU_SPIKE_AND_SIDECAR_
                # LIFECYCLE_HANDOFF.md already diagnosed but was never
                # actually applied: Android Auto's media audio channel
                # is protocol-mandatory 48000 Hz (real phone-side
                # logcat, 2026-08-21, rejects 44100 outright with
                # "wrong sampling rate 44100" and tears the whole
                # session down) -- but ALSA's own "plug" layer was
                # then doing 48000->44100 SOFTWARE resampling in user
                # space on every audio packet to reach this dmix
                # slave, which that same doc measured at 35-45% CPU on
                # this single-core Cortex-A5 (the real cause of the
                # CPU-spike/crash that motivated the original, since-
                # reverted 44100 change in session.cpp). Matching this
                # slave's rate to 48000 instead removes the resample
                # step entirely -- AA sends 48000, ALSA opens hw:0,0
                # at 48000, nothing in between has to convert
                # anything. Not yet hardware-tested for CPU usage with
                # this exact combination (48000 end to end) -- confirm
                # via `top` during playback per that doc's own
                # verification checklist.
                rate 48000
        }
}
# 2026-08-29: same real system-wide EQ insertion as carpi_eq_out above,
# for this separate 44.1kHz hardware path (softvol5's own route) -- a
# second instance since this is a genuinely distinct dmix consumer, not
# double-processing of the same audio.
pcm.carpi_eq_out2 {
        type ladspa
        slave {
                pcm "hw:0,0"
                period_size 1024
                buffer_size 16384
                format S16_LE
                rate 44100
        }
        path "/usr/lib/ladspa"
        plugins {
                0 {
                        label "carpi_eq"
                        filename "/usr/lib/ladspa/carpi_eq.so"
                        policy none
                        input {
                                bindings { 0 0; 1 1 }
                        }
                        output {
                                bindings { 0 2; 1 3 }
                        }
                }
        }
}
pcm.!dmix2 {
        type dmix
        ipc_key 16790
        ipc_key_add_uid yes
        slave {
                pcm "carpi_eq_out2"
#               period_time 0
                period_size 1024
                buffer_size 16384
                format S16_LE
                rate 44100
        }
}
pcm.!dsnoop {
        type dsnoop
        ipc_key 5778
        ipc_key_add_uid yes
        slave {
                pcm "hw:0,1"
#               period_time 0
                period_size 4096
                buffer_size 16384
                channels 2
#               format S16_LE
#                rate 16000
        }
        bindings.0 0
}

defaults.pcm.rate_converter "speexrate_medium"

