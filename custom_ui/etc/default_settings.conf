# custom_ui bundled default settings -- the ONLY seed this app
# consults on first boot / a not-yet-provisioned device. See
# src/core/config_store.h for the full load-order/precedence
# explanation; short version: this app's own live layer
# (/data/custom_ui/settings.conf) always wins once it exists, this
# file only fills gaps, and every key here gets copied into the live
# layer and never re-read after that first load -- this app has no
# link to anything stock/msncfg-related at all, on purpose, per
# request to fully decouple from it (the stock MSN ini seed files,
# /msnprofile/FactoryConfig.ini and MsnProductInfo.ini, and the stock
# live file /data/msncfg/Setting.config).
#
# This is the tracked source copy. `make ui` stages it into
# build/default_settings.conf automatically, right alongside hal.conf
# and the compiled binary -- scp the whole build/ directory to the
# device (see scripts/run_on_device.sh) and it's picked up with no
# /etc or /data setup needed, same convention as hal.conf.
#
# Full search order (first match wins -- see
# ConfigStore::resolve_default_seed_path()):
#   1. <directory containing the running binary>/default_settings.conf
#   2. /data/custom_ui/default_settings.conf -- writable userdata
#      partition, reflash-proof edit target on a deployed device.
#   3. /etc/custom_ui/default_settings.conf -- would be a real
#      firmware image's shipped default; not wired into a
#      firmware_overlay image build yet, same as hal.conf.
# If none of these exist, ConfigStore's own hardcoded per-call
# fallback values (each settings_screen.cpp row's own get_int/
# get_bool default argument) are used instead -- non-fatal, matching
# every other optional-file pattern in this codebase.
#
# Values below are this reconstruction's real, disassembly-confirmed
# factory defaults -- carried over from firmware_overlay/msnprofile/
# FactoryConfig.ini + MsnProductInfo.ini (this device's real shipped
# values, see docs/SETTINGS_REFERENCE.md) and the real captured
# Setting.config dump (firmware_source/mtd7_userdata/msncfg/
# Setting.config) for the handful of keys only that dump carries.
# Language is deliberately 4097 (English), not the real dump's 4096 --
# see SETTINGS_REFERENCE.md section on Language: 4096 decodes to an
# anomalous/reserved slot, confirmed not a real selectable language.

[General]
Backlight=100
Brightness=128
Contrast=128
Saturation=64
Volume=32
Mute=false
Language=4097
WLANType=3
McuType=6
CanType=0
ScreenType=1
ResolutionType=1
BlueToothType=6
RadioType=0
MirroringLinkType=2
ReversingVolumeCut=70
AECDelay=50
RightHandCarDriver=false
DisableWindowEffect=true
TouchCalibrateAction=false
AutoStartCarLink=true
ProjectionType=AndroidAuto

[BlueTooth]
# Deliberately different from the stock firmware's own name ("Limcet
# Box") -- this device dual-boots between stock MsnCoreApp and
# custom_ui (same physical Bluetooth chip/MAC either way), and sharing
# one name risked the phone treating a re-flash/switch as the same
# already-paired device with a now-different profile/capability set.
DeviceName=Prado CustomUI

[Audio]
OEMMicrophone=false
Bass=0
Mid=0
Treble=0
Loudness=false
MediaVolume=80
GuidanceVolume=80
SystemVolume=80
