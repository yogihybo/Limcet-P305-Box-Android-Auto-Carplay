# custom_ui HAL configuration -- Bluetooth (blueware daemon) and WiFi
# AP (wireless Android Auto/CarPlay handoff) settings. Edit this file
# directly to change any of these without rebuilding custom_ui or
# androidauto-sidecar; both read it at startup.
#
# This is the shipped default (deployed to /etc/custom_ui/hal.conf).
# To override on a live device without touching the firmware image
# itself, copy this file to /data/custom_ui/hal.conf and edit that
# copy instead -- it's checked first and wins if present. See
# custom_ui/src/core/hal_config.h for the full search order and the
# built-in fallback values used if neither file exists.

[Bluetooth]
# Path to the Feasycom blueware daemon binary.
DaemonPath=/usr/bin/blueware
# Properties file blueware is launched with -- selects module type
# (BW121 vs BW123) and UART/GPIO wiring. This board is the BW121
# variant (docs/WIRELESS_AND_INIT.md section 5) -- confirmed via
# decompile of the real stock app's own launch command.
PropertiesPath=/etc/blueware-bw121.properties
# AT-command channel blueware exposes once running.
SerialPort=/dev/bw_serial
# Where blueware's own stdout/stderr get redirected. Deliberately NOT
# /dev/null (unlike the stock app) -- blueware's own GPIO91/bpio_init
# error messages here are the most direct way to diagnose a
# Bluetooth-enable failure, see docs/WIRELESS_AND_INIT.md section 5.
LogPath=/tmp/blueware.log

[WiFi]
# Script that brings up this device's own dynamic hostapd AP for
# wireless Android Auto/CarPlay credential handoff.
ApScript=/etc/wifi_ap.sh
# This device's own AP address once wifi_ap.sh has run.
ApAddress=192.168.43.1
# SSID/password the AP advertises and hands to the phone over
# Bluetooth during the wireless pairing handshake.
ApSsid=carplay_wifi
ApPassword=88888888
# Security mode value sent in the WIFI_INFO_RESPONSE step of the
# bw_aap handshake (see androidauto/bw_aap_client.h) -- 8 = WPA2-PSK,
# cross-checked against this device's real hostapd config.
ApSecurityMode=8
# TCP port the phone connects back to once it's joined the AP, to
# start the actual Android Auto session.
SessionPort=5277
